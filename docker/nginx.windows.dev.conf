# Windows 本地开发环境 nginx 配置
# 将前后端服务统一通过 nginx 访问
#
# 使用前请确保：
# 1. 安装 nginx for Windows
# 2. 前端运行在 http://localhost:5173
# 3. 后端运行在 http://localhost:8787
# 4. Supabase 运行在 http://localhost:8000
# 5. TTS 服务运行在 http://localhost:9191

upstream frontend {
    server 127.0.0.1:5173;
}

upstream backend {
    server 127.0.0.1:8787;
}

upstream supabase {
    server 127.0.0.1:8000;
}

upstream tts {
    server 127.0.0.1:9191;
}

server {
    listen 80;
    server_name localhost;

    # 前端静态文件 - 开发环境代理到 Vite
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite HMR 支持
        proxy_buffering off;
    }

    # 后端 API 请求
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 增加超时时间以支持大文件上传
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Supabase 服务
    location /supabase/ {
        rewrite ^/supabase/(.*) /$1 break;
        proxy_pass http://supabase;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TTS 服务
    location /tts/ {
        rewrite ^/tts/(.*) /$1 break;
        proxy_pass http://tts;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }
}
