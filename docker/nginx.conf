# Akasha 项目 nginx 部署配置
#
# 此配置文件用于统一前后端访问，用户只需访问 nginx 端口即可
#
# 架构说明：
# - 用户访问 http://localhost (nginx, 端口 80)
# - 静态资源 -> 由 nginx 直接返回 dist 目录文件
# - /api/* -> 反向代理到后端服务 (端口 8787)
# - /supabase/* -> 反向代理到 Supabase 服务 (端口 8000)
# - /tts/* -> 反向代理到 TTS 服务 (端口 9191)

upstream frontend {
    server host.docker.internal:5173;
}

upstream backend {
    server host.docker.internal:8787;
}

upstream supabase {
    server host.docker.internal:8000;
}

upstream tts {
    server host.docker.internal:9191;
}

server {
    listen 80;
    server_name localhost;

    # 前端静态文件 - 如果是生产环境，取消下面一行的注释
    # root /usr/share/nginx/html;
    # index index.html;

    # 开发环境：代理到 Vite 开发服务器
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite HMR 支持
        proxy_buffering off;
    }

    # 后端 API 请求 - 代理到 Express 后端
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 增加超时时间以支持大文件上传
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Supabase 服务 - 代理到本地 Supabase
    location /supabase/ {
        rewrite ^/supabase/(.*) /$1 break;
        proxy_pass http://supabase;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TTS 服务
    location /tts/ {
        rewrite ^/tts/(.*) /$1 break;
        proxy_pass http://tts;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 错误页面配置
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
